{% extends "base.html" %}
{% block title %}Preguntas · {{ site.brand }}{% endblock %}
{% block content %}
<section class="narrow">
  <div class="progress" role="progressbar" aria-label="Progreso del examen" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="bar"></div></div>
  <p id="count" class="note" aria-live="polite"></p>
  <form id="quiz" method="post" action="{{ url_for('submit_test') }}">
    {% for q in questions %}
    <fieldset class="q" hidden>
      <legend>{{ q.text }}</legend>
      {% for o in q.options %}
      <label class="opt"><input type="radio" name="q{{ q.id }}" value="{{ loop.index0 }}"><span>{{ o }}</span></label>
      {% endfor %}
    </fieldset>
    {% endfor %}
    <div class="cta-row">
      <button type="button" id="prev" class="btn ghost">Anterior</button>
      <button type="button" id="next" class="btn">Siguiente</button>
      <button type="submit" id="finish" class="btn" hidden>Ver mi resultado</button>
    </div>
  </form>
</section>
<script>
const qs=[...document.querySelectorAll('.q')],bar=document.getElementById('bar'),
cnt=document.getElementById('count'),progress=document.querySelector('.progress'),prev=document.getElementById('prev'),
next=document.getElementById('next'),fin=document.getElementById('finish');
let i=0;
function show(){
  qs.forEach((q,k)=>q.hidden=k!==i);
  bar.style.width=((i+1)/qs.length*100)+'%';
  progress.setAttribute('aria-valuenow',String(Math.round((i+1)/qs.length*100)));
  cnt.textContent='Pregunta '+(i+1)+' de '+qs.length;
  prev.style.visibility=i?'visible':'hidden';
  next.hidden=i===qs.length-1; fin.hidden=!next.hidden;
}
next.onclick=()=>{if(i<qs.length-1){i++;show();window.scrollTo(0,0)}};
prev.onclick=()=>{if(i>0){i--;show()}};
show();
</script>
{% endblock %}
